# Server Configuration
server.port=8080
spring.application.name=portfolio-api

# MongoDB Configuration (Optional - will work without MongoDB)
spring.data.mongodb.uri=mongodb://localhost:27017/portfolio
spring.data.mongodb.database=portfolio
spring.data.mongodb.auto-index-creation=true

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:8000,http://localhost:8080,https://deepakkharol.com,https://www.deepakkharol.com

# Logging
logging.level.com.deepakkharol.portfolio=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=WARN

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
